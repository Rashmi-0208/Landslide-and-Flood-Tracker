<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Flood & Landslide Tracker — Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
  :root{--brand:#0a3a76;}

  body{
    font-family:Segoe UI, Tahoma, sans-serif;
    margin:0;
    background:#f2f6f9;
  }

  header{
    background:var(--brand);
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  header button{
    background:white;
    color:var(--brand);
    border:none;
    padding:7px 14px;
    font-weight:700;
    border-radius:6px;
    cursor:pointer;
  }

  main{
    max-width:1100px;
    margin:auto;
    padding:20px;
    display:grid;
    grid-template-columns:1fr 400px;
    gap:20px;
  }

  @media(max-width:900px){
    main{ grid-template-columns:1fr; }
  }

  .card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
  }

  .value{
    color:#0a3a76;
    font-weight:700;
  }

  input[type=range]{
    width:100%;
  }

  .btn{
    background:var(--brand);
    color:white;
    border:none;
    padding:10px;
    font-size:1rem;
    font-weight:700;
    width:100%;
    margin-top:10px;
    border-radius:8px;
    cursor:pointer;
  }

  .alert-box{
    padding:20px;
    color:white;
    border-radius:8px;
    text-align:center;
    font-weight:800;
  }

  .risk-bar{
    width:100%;
    background:#d7e1ea;
    height:18px;
    border-radius:8px;
    margin-top:10px;
    overflow:hidden;
  }

  .risk-fill{
    width:0%;
    height:100%;
    background:green;
    transition:width .3s, background-color .3s;
  }

  #stopSirenBtn{
    background:#d63031;
    padding:10px;
    margin-top:10px;
    border:none;
    color:white;
    font-weight:800;
    width:100%;
    border-radius:8px;
    display:none;
    cursor:pointer;
  }

  #map{
    height:260px;
    border-radius:8px;
    margin-top:10px;
  }
</style>
</head>

<body>

<header>
  <h2>FLOOD & LANDSLIDE TRACKER — Dashboard</h2>
  <div>
    <span id="userDisplay"></span>
    <button id="signOutBtn">Sign out</button>
  </div>
</header>

<main>

  <section class="card">
    <h2>Environmental Inputs</h2>

    <label>Rainfall (mm/hr): <span class="value" id="rainVal">0</span></label>
    <input type="range" id="rainInput" min="0" max="200" />

    <label>Soil Moisture (%): <span class="value" id="soilVal">0%</span></label>
    <input type="range" id="soilInput" min="0" max="100" />

    <label>Humidity (%): <span class="value" id="humidityVal">0%</span></label>
    <input type="range" id="humidityInput" min="0" max="100" />

    <label>Temperature (°C): <span class="value" id="tempVal">25°C</span></label>
    <input type="range" id="tempInput" min="-20" max="50" value="25" />

    <button id="calcBtn" class="btn">Calculate Risk Level</button>

  </section>

  <aside>
    <div class="card alert-box" id="alertBox">
      <div id="alertText">System Idle — Click Calculate</div>

      <div class="risk-bar">
        <div class="risk-fill" id="riskFill"></div>
      </div>
    </div>

    <button id="stopSirenBtn">STOP SIREN</button>

    <div class="card">
      <h3>Detected Outputs</h3>
      <p>Flood Risk: <b id="floodRisk">-</b></p>
      <p>Landslide Risk: <b id="landRisk">-</b></p>
      <p>Overall Status: <b id="finalStatus">-</b></p>
    </div>

    <div class="card">
      <h3>Your Location</h3>
      <div id="map"></div>
      <p id="locationCoords"></p>
    </div>
  </aside>

</main>

<audio id="sirenSound" src="https://actions.google.com/sounds/v1/alarms/air_raid_siren.ogg"></audio>
<audio id="alertBeep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* ---------------- LOGIN VALIDATION ---------------- */
let logged = localStorage.getItem("loggedIn");
let guest = localStorage.getItem("guestMode");

if (!logged && !guest) window.location.href = "index.html";

const userDisplay = document.getElementById("userDisplay");
if (guest === "true") userDisplay.textContent = "Guest User";
else userDisplay.textContent = "Signed in as: " + localStorage.getItem("registeredNumber");


/* ---------------- ELEMENTS ---------------- */
const rainInput = document.getElementById("rainInput");
const soilInput = document.getElementById("soilInput");
const humidityInput = document.getElementById("humidityInput");
const tempInput = document.getElementById("tempInput");

const rainVal = document.getElementById("rainVal");
const soilVal = document.getElementById("soilVal");
const humidityVal = document.getElementById("humidityVal");
const tempVal = document.getElementById("tempVal");

const floodRiskEl = document.getElementById("floodRisk");
const landRiskEl = document.getElementById("landRisk");
const finalStatusEl = document.getElementById("finalStatus");

const alertBox = document.getElementById("alertBox");
const alertText = document.getElementById("alertText");
const riskFill = document.getElementById("riskFill");

const siren = document.getElementById("sirenSound");
siren.loop = true;

const stopSirenBtn = document.getElementById("stopSirenBtn");


/* ---------------- SLIDER DISPLAY ---------------- */
function updateDisplay() {
  rainVal.textContent = rainInput.value;
  soilVal.textContent = soilInput.value + "%";
  humidityVal.textContent = humidityInput.value + "%";
  tempVal.textContent = tempInput.value + "°C";
}

[rainInput, soilInput, humidityInput, tempInput].forEach(sl =>
  sl.addEventListener("input", updateDisplay)
);


/* ---------------- ALERT COLORS ---------------- */
function setAlertStyle(status) {
  const colors = {
    Safe: "#2ecc71",
    Moderate: "#f1c40f",
    High: "#ff8c00",
    Critical: "#e01e1e"
  };

  const messages = {
    Safe: "GREEN SIGNAL — Normal Conditions",
    Moderate: "YELLOW ALERT — Moderate Risk",
    High: "ORANGE WARNING — High Risk & Preparation Needed",
    Critical: "RED EMERGENCY — CRITICAL THREAT!"
  };

  alertBox.style.background = colors[status];
  alertText.textContent = messages[status];
}


/* ---------------- RISK BAR UPDATE ---------------- */
function updateRiskBar(percent, status){
  const colors = {
    Safe: "#2ecc71",
    Moderate: "#f1c40f",
    High: "#ff8c00",
    Critical: "#e01e1e"
  };

  riskFill.style.width = percent + "%";
  riskFill.style.background = colors[status];
}


/* ---------------- CALCULATE RISK ---------------- */
function calculateRisk() {

  const rain = Number(rainInput.value);
  const soil = Number(soilInput.value);
  const humidity = Number(humidityInput.value);
  const temp = Number(tempInput.value);

  let floodScore = rain * 0.6 + humidity * 0.3 - Math.max(0, (temp - 25) * 0.4);
  let landScore  = rain * 0.4 + soil * 0.6 - Math.max(0, (15 - temp) * 0.5);

  floodScore = Math.max(0, floodScore);
  landScore = Math.max(0, landScore);

  let floodRisk = "Safe";
  if (floodScore > 120) floodRisk = "Critical";
  else if (floodScore > 80) floodRisk = "High";
  else if (floodScore > 40) floodRisk = "Moderate";

  let landRisk = "Safe";
  if (landScore > 110) landRisk = "Critical";
  else if (landScore > 75) landRisk = "High";
  else if (landScore > 40) landRisk = "Moderate";

  floodRiskEl.textContent = floodRisk;
  landRiskEl.textContent = landRisk;

  let status = "Safe";
  if (floodRisk === "Critical" || landRisk === "Critical") status = "Critical";
  else if (floodRisk === "High" || landRisk === "High") status = "High";
  else if (floodRisk === "Moderate" || landRisk === "Moderate") status = "Moderate";

  finalStatusEl.textContent = status;

  setAlertStyle(status);

  /* ---------------- PRECISE RISK BAR LOGIC ---------------- */
  const highest = Math.max(floodScore, landScore);

  const MIN_RISK_SCORE = 40; 
  const MAX_RISK_SCORE = 150;

  let normalized = (highest - MIN_RISK_SCORE) / (MAX_RISK_SCORE - MIN_RISK_SCORE);

  if (normalized < 0) normalized = 0;
  if (normalized > 1) normalized = 1;

  const percent = Math.round(normalized * 100);

  updateRiskBar(percent, status);

  if(status === "Critical"){
    siren.play().catch(()=>{});
    stopSirenBtn.style.display = "block";
  } else {
    siren.pause();
    siren.currentTime = 0;
    stopSirenBtn.style.display = "none";
  }
}

document.getElementById("calcBtn").addEventListener("click", calculateRisk);


/* ---------------- STOP SIREN ---------------- */
stopSirenBtn.addEventListener("click", () => {
  siren.pause();
  siren.currentTime = 0;
  stopSirenBtn.style.display = "none";
});


/* ---------------- MAP ---------------- */
let map, marker;

navigator.geolocation.getCurrentPosition(pos => {
  let lat = pos.coords.latitude;
  let lon = pos.coords.longitude;

  document.getElementById("locationCoords").textContent =
    "Latitude: " + lat.toFixed(4) + ", Longitude: " + lon.toFixed(4);

  map = L.map('map').setView([lat, lon], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
    .addTo(map);

  marker = L.marker([lat, lon]).addTo(map).bindPopup("You are here").openPopup();
});


/* ---------------- SIGN OUT ---------------- */
document.getElementById("signOutBtn").addEventListener("click", () => {
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("guestMode");
  window.location.href = "index.html";
});


/* INITIAL RUN */
updateDisplay();
calculateRisk();

</script>

</body>
</html>
